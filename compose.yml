services:

  django-app:
    build: .
    image: erfaw/digital-business-card-django:v0.20.0
    ports:
      - "8000:8000"
    restart: unless-stopped

  database:
    image: postgres:18

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    
volumes:
  postgres_data: