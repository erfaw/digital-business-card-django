<!-- Navbar -->
<!-- ===================== -->

<header>

    <nav class="navbar">

        <a href="{% url 'index' %}" class="logo">
            <span class="logo-aa">Digital Business Card</span>
        </a>

        <ul class="nav-links">

            <li>
                <a
                {% if request.path == '/' %}
                    class="active"
                {% endif %}
                href="{% url 'index' %}">
                    Home
                </a>
            </li>

            <li>
                <a
                {% if 'register' in request.path %}
                    class="nav-item active mr-3"
                {% else %}
                    class="nav-item mr-3"
                {% endif %}
                href="{% url 'register' %}">
                    Register
                </a>
            </li>

            <li>
                <a
                {% if 'login' in request.path %}
                    class="nav-item active mr-3"
                {% else %}
                    class="nav-item mr-3"
                {% endif %}
                href="{% url 'login' %}">
                    Login
                </a>
            </li>

        </ul>

    </nav>

</header>
