{% extends 'base.html' %}

{% block content %}
<!-- ================= MAIN ================= -->

<main>

    <section class="hero">

        <div class="hero-card register-card">

            <div class="card-tag">
                // Create Account
            </div>

            <h1>
                Login
                <span>Digital Card</span>
            </h1>

            <p>
                Welcome back!
            </p>

            <form class="register-form">

                <label>Email</label>
                <div class="input-group">

                    <input type="email" placeholder="john@example.com">

                </div>

                <label>Password</label>
                <div class="input-group">

                    <input type="password" placeholder="••••••••">

                </div>


                <button class="btn btn-primary register-btn">
                    Login
                </button>

            </form>

        </div>

    </section>

</main>
{% endblock %}
