<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AA Technology</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <canvas id="bg"></canvas>

    <!-- ================= NAVBAR ================= -->

    <header>

        <nav class="navbar">

            <a href="index.html" class="logo">
                <span class="logo-aa">AA</span>
                <span class="logo-text">Technology</span>
            </a>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="#">Register</a></li>
                <li><a href="#">Login</a></li>
            </ul>

        </nav>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <section class="hero">

            <div class="hero-card register-card">

                <div class="card-tag">
                    // Create Account
                </div>

                <h1>
                    Join
                    <span>AA Technology</span>
                </h1>

                <p>
                    Create your account and start your journey with us.
                </p>

                <form class="register-form">

                    <label>Full Name</label>
                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="John Doe">

                    </div>

                    <label>Email</label>
                    <div class="input-group">

                        <input
                            type="email"
                            placeholder="john@example.com">

                    </div>

                    <label>Password</label>
                    <div class="input-group">

                        <input
                            type="password"
                            placeholder="••••••••">

                    </div>

                    <label>Confirm Password</label>
                    <div class="input-group">

                        <input
                            type="password"
                            placeholder="••••••••">

                    </div>

                    <button class="btn btn-primary register-btn">
                        Create Account
                    </button>

                </form>

            </div>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-container">

            <div class="footer-logo">

                <span class="logo-aa">AA</span>
                <span class="logo-text">Technology</span>

            </div>

            <p>
                Building modern digital experiences with clean design.
            </p>

            <div class="footer-line"></div>

            <small>
                © 2026 AA Technology — HTML • CSS • JavaScript
            </small>

        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
